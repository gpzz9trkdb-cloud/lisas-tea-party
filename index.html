<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lisas Tea Party 🌸</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="hero">

    <div class="envelope-wrapper" id="startScreen">

        <div class="letter"></div>

        <img
            src="assets/illustrations/IMG_1650.png"
            alt="Briefumschlag"
            class="envelope"
        >

    </div>

    <button id="openButton">
        💌 Öffnen
    </button>

</main>


<section class="invitation hidden" id="invitation">

    <div class="paper">

        <h1>Da ist eine Einladung für dich angekommen...</h1>

        <p class="intro">

            Hallo Maus,

            <br><br>

            ich möchte meinen Geburtstag mit meinen Lieblingsmenschen verbringen und würde mich riesig freuen, wenn du dabei bist <3

        </p>

        <div class="details">

            <p><strong>📅 Datum</strong><br>05. September 2026</p>

            <p><strong>🕚 Uhrzeit</strong><br>ab 11:00 Uhr</p>

            <p><strong>📍 Ort</strong><br>Bei mir zu Hause</p>

        </div>

        <div class="choices">

            <button class="yes">
                Ich bin gerne dabei
            </button>

            <button class="no">
                Leider muss ich diesmal absagen
            </button>

        </div>

    </div>

</section>
<script src="script.js"></script>

</body>
</html>
