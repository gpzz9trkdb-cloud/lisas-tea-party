<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lisas Tea Party 🌸</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="invitation">

    <div class="envelope-container">

    <div class="envelope">

    <img
        src="assets/illustrations/envelope.png"
        alt="Briefumschlag"
        class="envelope-image"
    />

</div>
        <h1>
            Für dich ist eine Einladung angekommen :)
        </h1>


        <button id="openInvitation">
            💌 Einladung öffnen
        </button>

    </div>



    <div class="invitation-card hidden">

        <h2>
            Schön, dass du da bist 🌸
        </h2>

        <p>
            Ich freue mich riesig, dass du hier bist.
            Ich möchte meinen Geburtstag mit meinen Lieblingsmenschen verbringen
            und würde mich sehr freuen, wenn du dabei bist. 🤍
        </p>


        <button>
            🌷 Weiter
        </button>

    </div>


</main>


<script src="script.js"></script>

</body>
</html>
